# Triangle Rides - Kafka (KRaft), topic setup, Kafka UI, Postgres, and the pipeline apps.
#
#   docker compose up -d                          infrastructure only (run the Python scripts on your laptop)
#   docker compose --profile apps up -d --build   everything: producer, 3 consumers and the dashboard
#   docker compose --profile apps logs -f         watch the pipeline
#   docker compose --profile apps down -v         stop everything and wipe the data
#
# The apps write to the Postgres container by default. Put DATABASE_URL=<Supabase URL> in .env
# to send them to Supabase instead (that is what the deployed dashboard reads).

x-app: &app
  build: .
  profiles: ["apps"]
  restart: unless-stopped
  environment:
    KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    DATABASE_URL: ${DATABASE_URL:-postgresql://rides:rides@postgres:5432/rides}
    EVENTS_PER_SEC: ${EVENTS_PER_SEC:-2}
  depends_on:
    kafka-init:
      condition: service_completed_successfully
    postgres:
      condition: service_healthy

services:
  kafka:
    image: apache/kafka:4.1.0
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # kafka:29092 for other containers, localhost:9092 for scripts on your laptop.
      KAFKA_LISTENERS: PLAINTEXT://:29092,PLAINTEXT_HOST://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3

  # Runs once: waits for the broker, creates the four topics, then exits.
  kafka-init:
    image: apache/kafka:4.1.0
    container_name: kafka-init
    depends_on:
      - kafka
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        K=/opt/kafka/bin/kafka-topics.sh
        until $$K --bootstrap-server kafka:29092 --list >/dev/null 2>&1; do
          echo "waiting for kafka..."; sleep 2
        done
        for t in ride-trips ride-zone-metrics ride-surge-alerts ride-fare-anomalies; do
          $$K --bootstrap-server kafka:29092 --create --if-not-exists --topic $$t --partitions 3
        done
        echo "topics ready"

  kafka-ui:
    image: ghcr.io/kafbat/kafka-ui:latest
    container_name: kafka-ui
    depends_on:
      - kafka
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      DYNAMIC_CONFIG_ENABLED: "true"

  postgres:
    image: postgres:16-alpine
    container_name: postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: rides
      POSTGRES_PASSWORD: rides
      POSTGRES_DB: rides
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rides -d rides"]
      interval: 3s
      retries: 20

  producer:
    <<: *app
    command: ["python", "producer.py"]

  consumer-storage:
    <<: *app
    command: ["python", "consumer_storage.py"]

  consumer-metrics:
    <<: *app
    command: ["python", "consumer_metrics.py"]

  consumer-ml:
    <<: *app
    command: ["python", "consumer_ml.py"]

  dashboard:
    <<: *app
    command: ["streamlit", "run", "dashboard/app.py", "--server.address=0.0.0.0", "--server.port=8501"]
    ports:
      - "8501:8501"

volumes:
  pgdata:
